# /etc/nginx/sites-available/nexuraai
# nexuraai.dev + www.nexuraai.dev  ->  Node SSR workers on 127.0.0.1:3000+
# certbot --nginx will add the 443 server block + HTTP redirect automatically.
#
# The worker pool is defined in /etc/nginx/conf.d/nexuraai-upstream.conf,
# generated by deploy/scale-cluster.sh. Fallback below keeps a single-process
# install working if that file is absent.

server {
    listen 80;
    listen [::]:80;
    server_name nexuraai.dev www.nexuraai.dev;

    client_max_body_size 25m;

    # gzip
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # long-cache hashed build assets
    location /_build/ {
        proxy_pass http://nexuraai_app;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # static files shipped in /public (fonts, icons, manifest)
    location ~* \.(?:woff2?|ttf|otf|png|jpe?g|svg|webp|avif|ico|wasm)$ {
        proxy_pass http://nexuraai_app;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://nexuraai_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # streaming AI responses
        proxy_buffering off;
        # If a worker is restarting mid-deploy, retry on the next one.
        proxy_next_upstream error timeout http_502 http_503;
    }
}
