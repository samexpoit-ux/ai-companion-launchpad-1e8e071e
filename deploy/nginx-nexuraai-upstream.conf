# /etc/nginx/conf.d/nexuraai-upstream.conf
# Default single-process fallback. deploy/scale-cluster.sh overwrites this file
# with one `server` line per worker for multi-core load balancing.
upstream nexuraai_app {
    least_conn;
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    keepalive 64;
}
